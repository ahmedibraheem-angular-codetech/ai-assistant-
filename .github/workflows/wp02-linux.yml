name: WP-02 Linux

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

jobs:
  wp02-linux:
    name: WP-02 process security on Ubuntu
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install build tools for WP-02 test binaries
        run: |
          sudo apt-get update
          sudo apt-get install -y clang build-essential

      - name: Install package and test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run WP-02 Linux process tests
        run: |
          python -m pytest \
            tests/test_mcp_process_remediation.py \
            tests/test_mcp_process.py \
            -vv --tb=short

      - name: Run focused MCP session/gateway regression
        run: |
          python -m pytest \
            tests/test_mcp_session.py \
            tests/test_mcp_gateway.py \
            tests/test_mcp_blocking.py \
            tests/test_mcp_config.py \
            -q --tb=line

      - name: compileall
        run: python -m compileall -q app tests
