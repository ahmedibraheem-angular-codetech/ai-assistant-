[package]
name = "personal-assistant-desktop"
version = "0.1.0"
description = "Mac app for the local personal AI assistant"
authors = ["Ahmed Ibraheem"]
license = ""
repository = ""
edition = "2024"
rust-version = "1.90"

[lib]
name = "assistant_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7.6", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.12.7", features = ["tray-icon"] }
tauri-plugin-log = "2"
# Desktop-only: the shortcut, Menu Bar and login item are driven from Rust,
# so the web view needs no extra JavaScript packages or permissions.
tauri-plugin-global-shortcut = "2"
tauri-plugin-autostart = "2"
libc = "0.2"
# Already in the tree through tauri; used for sleep and join in services.rs.
tokio = { version = "1", features = ["time", "macros"] }
# Plain HTTP to 127.0.0.1 only: no TLS stack needed.
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }

[dev-dependencies]
tempfile = "3"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
